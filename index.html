<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Em breve novo site - Jota Investimentos</title>
  <!-- Font Awesome 6 (ícones sociais) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2a2a2a;
      font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    /* Área principal que ocupa todo o espaço disponível e centraliza o conteúdo */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    /* Bloco central com todo o texto + logo */
    .hero {
      text-align: center;
      max-width: 90%;
      width: 100%;
      animation: fadeInUp 0.7s ease-out;
    }

    /* Texto acima da logo */
    .text-above {
      font-size: 1.6rem;
      letter-spacing: -0.3px;
      font-weight: 400;
      color: #e0e0e0;
      margin-bottom: 1.8rem;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    /* --- LOGO (visual marcante e personalizado) --- */
    .logo-wrapper {
      margin: 2.2rem 0;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
      transition: transform 0.2s ease;
    }

    .logo-icon {
      font-size: 4.2rem;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      background: linear-gradient(145deg, #FFD966, #FFB347);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-block;
      line-height: 1;
    }

    .logo-text {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF, #D4AF37);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 2px 3px rgba(0,0,0,0.2);
      font-family: inherit;
    }

    /* adaptação para telas pequenas: logo menor mas ainda impactante */
    @media (max-width: 550px) {
      .logo-icon {
        font-size: 2.8rem;
      }
      .logo-text {
        font-size: 2.4rem;
      }
      .text-above {
        font-size: 1.3rem;
      }
      .text-below {
        font-size: 1.1rem;
      }
      .social-links a {
        font-size: 1.7rem;
        margin: 0 0.8rem;
      }
    }

    /* Texto logo abaixo da logo */
    .text-below {
      font-size: 1.3rem;
      font-weight: 400;
      margin-top: 1.8rem;
      color: #cbcbcb;
      background: rgba(255,255,255,0.05);
      display: inline-block;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      backdrop-filter: blur(2px);
    }

    /* Rodapé profissional com ícones + créditos */
    footer {
      background-color: #1e1e1e;
      padding: 1.8rem 1rem 1.5rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: auto;
    }

    /* container dos ícones sociais */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }

    .social-links a {
      color: #e2e2e2;
      font-size: 2rem;
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.03);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      text-decoration: none;
      backdrop-filter: blur(4px);
    }

    .social-links a:hover {
      color: #ffffff;
      transform: translateY(-4px);
      background-color: rgba(255, 180, 60, 0.2);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    /* estilo específico para cada ícone com leve cor no hover (opcional) */
    .social-links a:nth-child(1):hover { color: #E4405F; }  /* instagram vibe */
    .social-links a:nth-child(2):hover { color: #FF0000; }  /* youtube */
    .social-links a:nth-child(3):hover { color: #26A5E4; }  /* telegram */

    /* crédito "Site feito pela minbrand" */
    .credit {
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      color: #aaa;
      margin-top: 0.6rem;
    }

    .credit a {
      color: #D4AF37;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      border-bottom: 1px dotted #D4AF37;
    }

    .credit a:hover {
      color: #FFD966;
      border-bottom-color: #FFD966;
    }

    /* animação suave de entrada */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ajuste de acessibilidade e foco */
    a:focus-visible, button:focus-visible {
      outline: 2px solid #FFB347;
      outline-offset: 4px;
      border-radius: 30px;
    }

    /* melhora responsividade geral */
    @media (max-width: 480px) {
      .hero {
        max-width: 95%;
      }
      .logo-wrapper {
        gap: 0.3rem;
        margin: 1.5rem 0;
      }
      .social-links a {
        width: 46px;
        height: 46px;
        font-size: 1.6rem;
      }
      .text-above {
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="main-content">
    <div class="hero">
      <!-- Texto acima da logo -->
      <div class="text-above">
        em breve um novo site
      </div>

      <!-- LOGO principal (ícone + nome minbrand) -->
      <div class="logo-wrapper">
        <img src="images/logo.svg" alt="Logo" class="logo-icon">
      </div>

      <!-- Texto abaixo da logo -->

      <div class="text-below">
        aguarde
      </div>
    </div>
  </div>

  <footer>
    <!-- Ícones das redes sociais (Instagram, YouTube, Telegram) -->
    <div class="social-links">
      <a href="https://www.instagram.com/ojotainvestimentos" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <i class="fab fa-youtube"></i>
      </a>
      <a href="https://telegram.org/" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
        <i class="fab fa-telegram"></i>
      </a>
    </div>

    <!-- crédito obrigatório: Site feito pela minbrand + link -->
    <div class="credit">
      Site feito pela <a href="https://minbrand.com" target="_blank" rel="noopener noreferrer">minbrand</a>
    </div>
  </footer>

</body>
</html>
